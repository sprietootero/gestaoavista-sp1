<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>W1 Gestão à Vista – SP1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #05171E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      text-align: center;
      padding: 40px;
    }
    .logo {
      width: 56px; height: 56px;
      background: #00C2B8;
      color: #05171E;
      font-weight: 900;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">W1</div>
    <h1>Gestão à Vista – SP1</h1>
    <p>Este painel está temporariamente offline.</p>
  </div>
</body>
</html>
